spring:
  application:
    name: smart-fridge

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_recipe_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}

# ── Application custom config ──────────────────────────────
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  admin-id: ${ADMIN_ID:1}
  default-image: https://images.unsplash.com/photo-1495521821757-a1efb6729352?w=800

  upload:
    directory: ${UPLOAD_DIR:uploads}

  google:
    client-id: ${GOOGLE_CLIENT_ID}

  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

